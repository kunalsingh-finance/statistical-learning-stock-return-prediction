name: Forecast validity checks
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Reconcile published synthetic outputs
        run: python scripts/verify_outputs.py --output-dir sample_outputs
      - name: Run clean synthetic workflow
        run: python -m src.fa590_stock_return_prediction.run --skip-neural-network --demo-months 24 --demo-stocks 40 --rf-estimators 10 --gb-estimators 10 --output-dir outputs/ci
      - run: python scripts/verify_outputs.py --output-dir outputs/ci
